upstream web_app {
    server web:8000;
}

upstream seaweedfs_filer {
    server seaweedfs:8888;
}

server {
    listen 80;
    server_name localhost _;

    client_max_body_size 20M;
    charset utf-8;

    # 1. Static files
    location /static/ {
        alias /var/www/static/;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # 2. Định tuyến /media/ vào Django để kiểm tra quyền truy cập bài PUBLISHED / Admin
    location /media/ {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Location nội bộ SeaweedFS Filer (Chỉ Nginx gọi qua X-Accel-Redirect từ Django)
    # Trình duyệt hoặc client bên ngoài gọi trực tiếp đường dẫn này sẽ bị chặn 404!
    location /_storage/ {
        internal;
        proxy_pass http://seaweedfs_filer/buckets/bimlab-media/;
        proxy_set_header Host $host;
        proxy_hide_header Content-Disposition;

        # Header an toàn CSP cho file HTML độc lập và ảnh
        add_header Content-Security-Policy "sandbox allow-scripts" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 4. Giao diện Web Viewer, Admin CMS & API
    location / {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
