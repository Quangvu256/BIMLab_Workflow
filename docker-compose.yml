services:
  # -------------------------------------------------------------
  # 1. Cơ sở dữ liệu quan hệ PostgreSQL 16
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: bimlab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bimlab_db}
      POSTGRES_USER: ${POSTGRES_USER:-bimlab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bimlab_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bimlab_user} -d ${POSTGRES_DB:-bimlab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bimlab_net

  # -------------------------------------------------------------
  # 2. Object Storage SeaweedFS (Master + Volume + Filer + S3 Gateway)
  # -------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:3.79
    container_name: bimlab_seaweedfs
    restart: unless-stopped
    command: "server -dir=/data -s3 -filer -s3.config=/etc/seaweedfs/s3.json -ip=seaweedfs"
    volumes:
      - ./data/seaweedfs:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    expose:
      - "8333" # S3 API Gateway
      - "8888" # Filer HTTP (cho Nginx X-Accel-Redirect)
      - "9333" # Master
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - bimlab_net

  # -------------------------------------------------------------
  # 3. Ứng dụng Web Django (Backend + Gunicorn)
  # -------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bimlab_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./web:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    networks:
      - bimlab_net

  # -------------------------------------------------------------
  # 4. Nginx Reverse Proxy (Cổng giao tiếp chính & X-Accel-Redirect)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: bimlab_nginx
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - web
      - seaweedfs
    networks:
      - bimlab_net

volumes:
  static_volume:
    name: bimlab_static_volume

networks:
  bimlab_net:
    name: bimlab_net
    driver: bridge
